[package]
name = "hawkeye"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
chromiumoxide = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
libc = "0.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
async-trait = "0.1.92"
russh = "0.63.3"
russh-sftp = "3.0.0"
zip = { version = "8.6.0", features = ["deflate"] }
rpassword = "7.5.4"
base64 = "0.23.1"
sha2 = "0.11.0"
